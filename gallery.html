    <!-- FILTER & MODAL SCRIPT -->
    <script>
        function filterGallery(category) {
            // Update button styles
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-[#00d8b4]', 'text-gray-950', 'shadow-lg', 'shadow-[#00d8b4]/20');
                btn.classList.add('bg-[#111827]', 'text-gray-300', 'border', 'border-gray-800');
            });
            event.target.classList.remove('bg-[#111827]', 'text-gray-300', 'border', 'border-gray-800');
            event.target.classList.add('bg-[#00d8b4]', 'text-gray-950', 'shadow-lg', 'shadow-[#00d8b4]/20');

            // Filter items
            const items = document.querySelectorAll('.gallery-item');
            items.forEach(item => {
                if (category === 'all' || item.classList.contains(category)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        function openModal(title, imgSrc, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalImg').src = imgSrc;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('galleryModal').classList.remove('hidden');
            document.getElementById('galleryModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('galleryModal').classList.remove('flex');
            document.getElementById('galleryModal').classList.add('hidden');
        }

        // Close modal on outside click
        window.onclick = function(event) {
            const modal = document.getElementById('galleryModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
